apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: airport-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector-container
          image: europe-west6-docker.pkg.dev/a12347073/uw-registry/collector:1.6
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /readinessProbe
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livenessProbe
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: collector-service
  namespace: airport-security
spec:
  type: ClusterIP
  ports:
    - port: 7070
      targetPort: 80
  selector:
    app: collector
