apiVersion: apps/v1
kind: Deployment
metadata:
  name: section
  namespace: airport-security
spec:
  selector:
    matchLabels:
      app: section
  template:
    metadata:
      labels:
        app: section
    spec:
      containers:
        - name: section-container
          image: ccuni/section-service-2025w
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /readinessProbe
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livenessProbe
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: section-service
  namespace: airport-security
spec:
  type: ClusterIP
  selector:
    app: section
  ports:
    - port: 7070
      targetPort: 80
