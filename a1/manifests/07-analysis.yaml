apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis
  namespace: airport-security
spec:
  selector:
    matchLabels:
      app: analysis
  template:
    metadata:
      labels:
        app: analysis
    spec:
      containers:
        - name: analysis-container
          image: ccuni/image-analysis-service-2025w
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"
              cpu: "750m"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /readinessProbe
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livenessProbe
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: airport-security
spec:
  type: ClusterIP
  selector:
    app: analysis
  ports:
    - port: 7070
      targetPort: 80
