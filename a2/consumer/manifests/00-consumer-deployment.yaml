apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: leaf-image-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: europe-west6-docker.pkg.dev/a12347073/uw-registry/consumer:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "kafka-service:9092"
            - name: KAFKA_GROUP_ID
              value: "test-group"
            - name: MONGO_URI
              value: "mongodb://mongodb-consumer:27017"
          livenessProbe:
            httpGet:
              path: /livenessProbe
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readinessProbe
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: leaf-image-management-system
  labels:
    app: consumer
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: consumer
